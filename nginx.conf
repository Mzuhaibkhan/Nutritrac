events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ── Gzip compression (Proxy Level) ───────────────────────────
  gzip            on;
  gzip_vary       on;
  gzip_proxied    any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # ── Rate Limiting Zones ──────────────────────────────────────
  # Limit AI endpoints to 15 req/min per IP with burst allowance of 5
  limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=15r/m;
  limit_req_status 429;

  server {
    listen ${PORT};

    # Force HTTPS redirect if requested over HTTP (Render proxy sets X-Forwarded-Proto)
    if ($http_x_forwarded_proto = "http") {
      return 301 https://$host$request_uri;
    }

    # ── Static asset caching (immutable, 1 year) ─────────────
    location /_next/static/ {
      proxy_pass       http://127.0.0.1:3000;
      proxy_set_header Host $host;
      add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Public files caching (1 day) ─────────────────────────
    location /public/ {
      proxy_pass       http://127.0.0.1:3000;
      proxy_set_header Host $host;
      add_header       Cache-Control "public, max-age=86400";
    }

    # ── Rate-limited AI endpoints (/api/analyze*, /api/chat) ─
    location ~* ^/api/(analyze|chat) {
      limit_req zone=ai_limit burst=5 nodelay;

      proxy_pass         http://127.0.0.1:5000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 120s;
    }

    # ── Route other /api/* to Flask backend ──────────────────
    location /api/ {
      proxy_pass         http://127.0.0.1:5000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 120s;
    }

    # ── Route everything else to Next.js ─────────────────────
    location / {
      proxy_pass         http://127.0.0.1:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_read_timeout 60s;

      # Fix for "upstream sent too big header" (Supabase large cookies)
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
    }
  }
}
