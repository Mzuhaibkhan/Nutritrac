events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ── Gzip compression ─────────────────────────────────────────
  gzip            on;
  gzip_vary       on;
  gzip_proxied    any;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    image/svg+xml;

  server {
    listen ${PORT};

    # Force HTTPS redirect if requested over HTTP (Render proxy sets X-Forwarded-Proto)
    if ($http_x_forwarded_proto = "http") {
      return 301 https://$host$request_uri;
    }

    # ── Static asset caching (immutable, 1 year) ─────────────
    location /_next/static/ {
      proxy_pass       http://127.0.0.1:3000;
      proxy_set_header Host $host;
      add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Public files caching (1 day) ─────────────────────────
    location /public/ {
      proxy_pass       http://127.0.0.1:3000;
      proxy_set_header Host $host;
      add_header       Cache-Control "public, max-age=86400";
    }

    # ── Route /api/* to Flask backend ────────────────────────
    location /api/ {
      proxy_pass         http://127.0.0.1:5000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # ── Route everything else to Next.js ─────────────────────
    location / {
      proxy_pass         http://127.0.0.1:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_read_timeout 60s;

      # Fix for "upstream sent too big header" (Supabase large cookies)
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
    }
  }
}
