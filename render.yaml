services:
  # Single Docker web service — nginx routes /api/* to Flask, everything else to Next.js
  - type: web
    name: nutritrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # ── MongoDB ──────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: MONGODB_DB_NAME
        value: nutritrack

      # ── Supabase (auth) ─────────────────────────────────────
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_KEY
        sync: false # Set in Render Dashboard (fallback for SUPABASE_SERVICE_ROLE_KEY)
      # These NEXT_PUBLIC_* vars are inlined at Docker build time by Next.js
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # Set in Render Dashboard (same value as SUPABASE_URL)
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard

      # ── AI / LLM keys (at least one recommended) ───────────
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard (optional)
      - key: GROK_API_KEY
        sync: false # Set in Render Dashboard (optional)

      # ── Strava OAuth (optional) ─────────────────────────────
      - key: STRAVA_CLIENT_ID
        sync: false # Set in Render Dashboard (optional)
      - key: STRAVA_CLIENT_SECRET
        sync: false # Set in Render Dashboard (optional)
      - key: STRAVA_REDIRECT_URI
        value: https://nutritrack.onrender.com/api/strava/callback
      - key: FRONTEND_URL
        value: https://nutritrack.onrender.com

      # ── CORS (same-origin via nginx, but set for safety) ────
      - key: CORS_ORIGINS
        value: https://nutritrack.onrender.com
