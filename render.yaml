services:
  # Single Docker web service — nginx routes /api/* to Flask, everything else to Next.js
  - type: web
    name: nutritrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # ── MongoDB ──────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: MONGODB_DB_NAME
        value: nutritrack

      # ── Clerk (auth) ────────────────────────────────────────
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false # Set in Render Dashboard (inlined at Docker build time)
      - key: CLERK_SECRET_KEY
        sync: false # Set in Render Dashboard
      - key: CLERK_JWT_KEY
        sync: false # Optional PEM Public Key from Clerk Dashboard for fast offline verification
      - key: CLERK_JWKS_URL
        sync: false # Optional JWKS URL from Clerk Dashboard

      # ── AI / LLM keys (at least one recommended) ───────────
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard (optional)
      - key: GROK_API_KEY
        sync: false # Set in Render Dashboard (optional)

      # ── Strava OAuth (optional) ─────────────────────────────
      - key: STRAVA_CLIENT_ID
        sync: false # Set in Render Dashboard (optional)
      - key: STRAVA_CLIENT_SECRET
        sync: false # Set in Render Dashboard (optional)
      - key: STRAVA_REDIRECT_URI
        value: https://nutritrack.onrender.com/api/strava/callback
      - key: FRONTEND_URL
        value: https://nutritrack.onrender.com

      # ── CORS (same-origin via nginx, but set for safety) ────
      - key: CORS_ORIGINS
        value: https://nutritrack.onrender.com
